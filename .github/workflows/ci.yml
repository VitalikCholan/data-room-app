name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api — lint, unit, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — pnpm/action-setup reads the `packageManager` field in
      # package.json, so CI can never drift from the version developers use.
      - uses: pnpm/action-setup@v4
      # Node 24, not 20: jsdom 30 loads undici 8, which calls
      # worker_threads.markAsUncloneable at import time. Node 20 does not have it, so the
      # whole web suite dies with "markAsUncloneable is not a function" before any test runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `prisma generate`, which needs no database.
      - run: pnpm install --frozen-lockfile

      # The same docker-compose.yml developers run, rather than a second copy of the
      # service definitions as GitHub `services:` blocks. Those cannot express MinIO's
      # `command:` or the bucket-creation container at all, so the two would have drifted.
      - name: Start Postgres and MinIO
        run: docker compose up -d --wait postgres minio

      - name: Create the bucket
        run: docker compose run --rm minio-init

      # Locally the e2e suite reads apps/api/.env.test, which points at a separate
      # database on the same server so a run can truncate freely. That file is a real env
      # file and stays gitignored (apps/api/.env.test.example is the template), so in CI
      # there is nothing for dotenv to load and the e2e step below supplies the same
      # values as step-level `env:` instead. The database itself has to be created per run.
      - name: Create the e2e database
        run: docker compose exec -T postgres createdb -U dataroom dataroom_test

      # DATABASE_URL is set per step, never on the job: two of these steps have to point
      # at *different* databases, and a job-level default is exactly how the e2e step
      # would end up silently migrating or truncating the wrong one.
      - name: Migrate the e2e database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dataroom:dataroom@localhost:5433/dataroom_test?schema=public

      - name: Migrate the development database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dataroom:dataroom@localhost:5433/dataroom?schema=public

      - run: pnpm --filter api lint

      # The unit suite deliberately gets no `env:`: jest.config.js loads no env file and
      # no unit spec touches Postgres or the bucket, so a green run here also proves the
      # 76 unit tests really are environment-free.
      - run: pnpm --filter api test

      # `test:e2e` sets DOTENV_CONFIG_PATH=.env.test, which does not exist in CI, so
      # every variable the app validates has to come from here — without this block the
      # suite has no configuration at all. DATABASE_URL must name the *test* database:
      # the specs truncate every table, and test/global-setup.ts aborts the run if the
      # name does not end in `_test`.
      - run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: postgresql://dataroom:dataroom@localhost:5433/dataroom_test?schema=public
          JWT_SECRET: ci-jwt-secret-value-long-enough
          REFRESH_SECRET: ci-refresh-secret-value-different
          PUBLIC_APP_URL: http://localhost:5173
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: data-room
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: 'true'

      # Emitting the contract here is what makes the web job's drift check meaningful:
      # the JSON is produced from this commit's DTOs, not from whatever was committed.
      - name: Emit the OpenAPI contract
        run: pnpm --filter api openapi:emit
        env:
          DATABASE_URL: postgresql://dataroom:dataroom@localhost:5433/dataroom?schema=public
          JWT_SECRET: ci-jwt-secret-value-long-enough
          REFRESH_SECRET: ci-refresh-secret-value-different
          PUBLIC_APP_URL: http://localhost:5173
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: data-room
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  web:
    name: web — lint, unit, build
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api

      # The download above overwrote the committed apps/api/openapi.json with the one the
      # api job emitted from this commit's DTOs, so diffing it catches a contract that was
      # never re-emitted after a DTO change — the near miss that made this whole check
      # pass vacuously once already.
      - run: git diff --exit-code apps/api/openapi.json

      # The frontend's only source of API types is the generated schema.d.ts. Regenerating
      # it from this commit's contract and diffing is what turns a DTO change the frontend
      # has not caught up with into a red build instead of a runtime surprise. `generate:api`
      # pipes openapi-typescript's output through prettier, so the committed file and a
      # fresh regeneration are byte-identical rather than differing on quote style alone.
      - run: pnpm --filter web generate:api
      - run: git diff --exit-code apps/web/src/api/schema.d.ts

      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
